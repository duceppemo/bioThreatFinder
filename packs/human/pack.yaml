# bioThreatFinder domain pack: human health
#
# A pack is DATA, not code. Adding or retargeting a domain means editing this
# file plus its watchlist - never the pipeline.

name: human
description: >
  High-consequence and notifiable human pathogens. Intended for public-health
  and clinical-adjacent metagenomic screening.

# ---------------------------------------------------------------------------
# Host depletion
# ---------------------------------------------------------------------------
# Reads matching the host are removed before classification. T2T-CHM13 is
# preferred over GRCh38: it closes the gaps that otherwise leak host reads into
# bacterial bins (centromeric/satellite repeats are a notorious source of
# spurious hits).
host:
  label: Homo sapiens
  taxid: 9606
  # Built by scripts/fetch_host_genome.sh human
  fasta: "${btf_db}/host/human/chm13v2.0.fa.gz"
  minimap2_index_sr: "${btf_db}/host/human/chm13v2.0.sr.mmi"
  minimap2_index_lr: "${btf_db}/host/human/chm13v2.0.map-ont.mmi"
  # Human reads are the bulk of most clinical specimens; keep them out of the
  # published output by default. Set to true only for validation runs.
  retain_host_reads: false

# ---------------------------------------------------------------------------
# Stage 1: broad screen
# ---------------------------------------------------------------------------
screen:
  # Shared across packs - one general-purpose index answers "what is in here".
  #
  # kraken2 is the PRIMARY arm: --report-minimizer-data supplies the distinct-minimizer
  # count and duplicity that separate reads spread across a genome from reads piled on
  # one conserved k-mer. Requires kraken2 >= 2.1.0.
  kraken2_db: "${btf_db}/kraken2/pluspf"
  # Amino-acid-aware arm, for divergent and novel agents that nucleotide k-mers
  # miss entirely. Poor precision in independent benchmarks, so its role is RECALL.
  metabuli_db: "${btf_db}/metabuli/refseq"
  # OPT-IN second opinion (--skip_krakenuniq defaults true), NOT the primary arm.
  # See docs/decisions.md D2 for why, and prefer a prebuilt index over a build.
  krakenuniq_db: "${btf_db}/krakenuniq/standard"
  # Orthogonal, ANI-based, very low false-positive rate for bacteria/archaea.
  #
  # Built from THIS PACK'S OWN REFS, not the GTDB distribution, by
  # scripts/build_sylph_db.sh - which now exists. For most of this project's life this
  # comment credited that script while no such file was present and the .syldb had been
  # hand-sketched with no recorded command; the builder was written 2026-10-05 and
  # reproduces the hand-built index exactly (same 359 genomes, same c/k/min-spacing, same
  # per-genome k-mer counts, same byte size; only the genome ORDER inside the file differs,
  # which is sylph's parallel completion order).
  #
  # sylph reports genome FILENAMES rather than taxids, and
  # parse_screen maps a hit back to a watchlist taxon by reading the taxid out of that
  # filename. The pack's refs are named <taxid>_<name>.fna.gz so this works; GTDB names
  # its files by GTDB accession, so every lookup missed and the arm silently contributed
  # nothing while the report still said "no sylph/ANI support".
  #
  # The GTDB sketch at ${db_root}/sylph/gtdb-r220-c200-dbv1.syldb remains useful for
  # asking "what else is in here", but that is Kraken2's job in this pipeline and it
  # would need a GTDB->NCBI mapping to answer the watchlist question.
  #
  # Because this path is sketched from refs/ rather than distributed, it goes stale when
  # refs/ grows - which it did, for 22 days, over 16 references including all twelve
  # Filoviridae (D46). Every build records the genome set it wrote in <db>.genomes.txt, read
  # back from `sylph inspect`, and a RUN compares that against this pack at launch - the
  # head node has no sylph, so without that record it could only compare timestamps.
  # `scripts/build_sylph_db.sh --check` makes the same comparison against the database
  # itself (exit 3 when stale); --stamp writes the record for a database that predates it.
  sylph_db: "${btf_db}/sylph/human_pack_refs.syldb"
  # Eukaryotic pathogens (parasites, fungi) are poorly served by GTDB, so stage 1 reaches
  # them through Kraken2 PlusPF AND the pack sketch above, then stage-2 alignment confirms.
  #
  # THIS USED TO SAY "rely on Kraken2 PlusPF", AND THAT WAS MEASURABLY WRONG (D48).
  # PlusPF holds no node for 19 of the 90 watchlist taxa - the helminths, several protozoa
  # and most dimorphic fungi - so for most of the organisms this line nominated it for, that
  # arm can never produce a row. It is not staleness and no rebuild changes it: PlusPF
  # carries no helminth library at all, and the absent fungi and protozoa have no genome in
  # its fungi/protozoa libraries under these taxids.
  #
  # What makes those 19 reachable is the sylph arm, which profiles THIS PACK's refs rather
  # than a distributed database: all 19 have a reference here and are in the sketch, and
  # `combining_rule: any_classifier_or` below lets either arm raise a candidate. So for
  # eukaryotes the two arms are NOT redundant - sylph is the only stage-1 arm that can see
  # that group, which is also why the sketch going stale (D46) cost them more than any
  # other taxa.
  #
  # Check before trusting this line again:
  #   python3 scripts/check_index_coverage.py --pack human   (exit 3 when a taxon is
  #                                                           absent from the index)
  #
  # The value is documentary - nothing reads this key - and is left unchanged so it stays
  # comparable with earlier runs. `sylph_and_kraken2_then_align` would describe the measured
  # behaviour better and should be adopted if a consumer is ever written.
  eukaryote_strategy: kraken2_then_align
  # Any classifier raises a candidate; consensus is recorded, not required.
  combining_rule: any_classifier_or

# ---------------------------------------------------------------------------
# Stage 2: targeted confirmation
# ---------------------------------------------------------------------------
confirm:
  # Curated reference genomes for watchlist taxa + their near neighbours.
  # Built by scripts/build_pack_refs.py --pack human
  refs_dir: "${btf_db}/packs/human/refs"
  refs_manifest: "${btf_db}/packs/human/refs/manifest.tsv"
  # Competitive mapping: reads are mapped against the target AND its near
  # neighbours simultaneously, then assigned to best hit. Without this, a
  # common environmental relative reads out as its high-consequence cousin.
  competitive_mapping: true
  # Marker tier (stage 2b). Built by scripts/build_marker_db.py --pack human.
  markers_dir: "${btf_db}/packs/human/markers"
  # Soft-mask intervals from scripts/mask_pack_refs.py. Masked bases are excluded
  # from the breadth denominator and reads lying entirely inside them are reported
  # rather than counted as evidence. Two independent 2025-2026 reviews put reference
  # curation ahead of assembly as a specificity lever (40-94% fewer false detections
  # with 100% true-positive preservation), and Wright et al. traced a false positive
  # to phage sequence inside a reference genome.
  masked_dir: "${btf_db}/packs/human/refs/masked"

# ---------------------------------------------------------------------------
# Default confirmation thresholds (per-taxon overrides live in watchlist.tsv)
# ---------------------------------------------------------------------------
# Derived from Wright et al. 2026, "From classification to confirmation: verifying
# taxonomic classifications by mapping metagenomic reads to reference genomes",
# Microbial Genomics, doi:10.1099/mgen.0.001739. Mapping-based confirmation removed
# 99.7% of false-positive taxa at ~52% read retention - the largest published effect
# size of any single intervention in this literature, and an order of magnitude
# larger than the differences between k-mer classifiers.
#
# Their recommended composite, which these encode:
#   (i)   at least one read maps
#   (ii)  >= 50% of classifier-assigned reads actually map
#   (iii) genome fraction covered >= 0.5%
#   (iv)  >= 98% identity of mapped reads to the reference
#
# (iv) is the NEAR-NEIGHBOUR discriminator and the one this pack previously got
# wrong at 0.90. In their Elizabethkingia case the call was correct at genus and
# wrong at species, and ~96% mapped-read identity is what revealed it. 0.90 would
# have passed it.
#
# NOTE these are simulation-calibrated floors, not universal constants. Their own
# low-biomass blood and tumour samples lost nearly all calls at these thresholds.
# Recalibrate per specimen type against the benchmark.
thresholds:
  min_unique_reads: 20
  min_breadth: 0.005
  max_depth_cv: 2.5
  min_read_identity: 0.98
  # Divergent viruses are legitimately far from any available reference, so a
  # species-discrimination floor built for bacteria would produce false negatives
  # exactly where sensitivity matters most.
  min_read_identity_by_group:
    virus: 0.88
    parasite: 0.95
  # PLATFORM MATTERS AS MUCH AS GROUP, AND LEAVING IT OUT BROKE ONT ENTIRELY.
  #
  # A 0.98 read-identity floor is a statement about SEQUENCING ERROR as much as about
  # phylogenetic distance. Illumina substitution error is ~0.1-1%, so 0.98 leaves room
  # to discriminate species. ONT does not: R10.4.1 simplex reads mean ~97-98% identity
  # with recent basecallers and worse with fast models, and the badread defaults the
  # benchmark simulates with produce a 95% mean. Applying 0.98 to ONT therefore made
  # every bacterial and fungal confirmation IMPOSSIBLE on that platform - the gate
  # failed on sequencing error alone, at every spike level, and the result was
  # indistinguishable from weak evidence. The plumbing positive control, whose whole
  # purpose is to fail loudly on misconfiguration, would have failed permanently on
  # its ONT arm for this reason.
  #
  # The consequence is a real shift in what discriminates near neighbours. On ONT,
  # read identity CANNOT do that job; competitive mapping (attributed_to_neighbour)
  # and the marker tier have to, and the identity gate degrades to a genus-level
  # sanity check. That is a weaker guarantee, and it is stated here rather than hidden
  # in a threshold.
  #
  # PROVISIONAL. These numbers are reasoned from platform error rates, not measured
  # on this pipeline. They are the first thing to set from the benchmark once it has
  # run - see docs/decisions.md D10.
  min_read_identity_by_platform:
    illumina:
      default: 0.98
      virus: 0.88
      parasite: 0.95
    ont:
      default: 0.90
      virus: 0.80
      parasite: 0.88
  # Wright et al. (ii): if most of the reads a classifier assigned do not survive
  # alignment, the k-mer evidence did not hold up.
  min_mapped_fraction_of_assigned: 0.50
  # Short alignments are a documented false-positive source on ONT, where a 50 bp
  # match inside a 10 kb read says almost nothing about where that read came from.
  #
  # THAT RATIONALE IS ONT-SPECIFIC AND THE FLAT 100 MADE THE GATE UNREACHABLE ON
  # ILLUMINA. A 2x101 library trims and soft-clips to a mean aligned length of 98-99, so
  # on real 2x100 data NOTHING COULD EVER BE CONFIRMED: 81 of 82 rows in the Zymo isolate
  # batch failed this gate, including Salmonella enterica in its own single-organism
  # library at 24M reads, breadth 0.9137, occupancy 0.9378, neighbour_ratio 1928, held at
  # `supported` by "mean_alignment_length 99 >= 100". Every confirmed_in_silico call in
  # the project's history is on 150 bp SIMULATED reads, for this reason and no other.
  # Fourth recurrence of "a threshold must be reachable, not merely strict" (D10, D11,
  # D20), invisible because the one fixture in the suite sits exactly on the boundary.
  # Used ONLY when the read length is unknown (no seqkit_stats for that sample).
  min_alignment_length: 100
  min_alignment_length_by_platform:
      illumina: 60
      ont: 100
  # PREFERRED. max(floor, fraction x the sample's measured avg_len), so the gate finally
  # expresses the ratio its rationale has always claimed. Gives 61 on 2x101, 90 on 2x150,
  # 151 on 2x251, 40 (the floor) on 2x50, and ~2,183 on the 7.3 kb median ONT read -
  # turning a branch that could never fire into a live one. A FLAT 60 WOULD HAVE
  # REPRODUCED THE ORIGINAL DEFECT AT 2x50, where the mean aligned length is ~49.
  min_alignment_fraction_of_read:
      illumina: 0.60
      ont: 0.30
  min_alignment_length_floor: 40

  # ---- DEPTH-CONDITIONAL STRAIN / SUB-SPECIES TYPING ----
  #
  # A strain claim must be refused when the depth cannot support it, and must SAY it
  # was refused. The arithmetic is unforgiving and worth writing down: a 4.83 Mb
  # bacterial genome at 150 bp reads needs ~161,000 reads per million of the library to
  # reach 20x, which is 16% of all reads - not a detection scenario. The plumbing
  # positive control at 5,000 rpm delivered 0.62x. At the benchmark's 100 rpm rung it is
  # 0.012x, where 1.2% of the genome is seen at most once.
  #
  # So the two claims separate, and they get separate gates.
  #
  # (1) MARKER / PATHOTYPE TYPING works at low depth because it needs reads on a short
  #     locus, not across a genome - which is why 57 of the 163 markers are pathotype,
  #     lineage, vaccine_strain or resistance. But ABSENCE does not work at low depth. A
  #     single-copy 1.5 kb marker at 0.012x expects 0.12 reads, so seeing none is the
  #     expected outcome whether or not the locus is there. Calling that ABSENT is
  #     positive evidence against a real finding, manufactured from no data.
  #     Below min_expected_reads_for_absence, a searched-and-not-found marker is
  #     reported UNKNOWN instead, which under the Kleene rules cannot promote a finding
  #     and cannot fire a veto or a vaccine stand-down.
  min_expected_reads_for_absence: 3.0
  #     Used when a marker has no nucleotide length recorded (protein- or HMM-only
  #     tiers). Deliberately a round assumption, not a measurement, and it only ever
  #     makes the gate MORE conservative.
  assumed_marker_bp: 1000
  # (2) GENOME-WIDE STRAIN IDENTITY - cgMLST, SNP typing, consensus lineage assignment -
  #     is not attempted at all below this mean depth. Nothing in the pipeline computes
  #     it yet; the gate exists so the report states "not attempted, depth X < Y" rather
  #     than leaving a reader to assume it was checked. ~20x is the conventional floor
  #     for confident haploid SNP calling.
  min_depth_for_genome_typing: 20.0
  mapq_min: 10

# ---------------------------------------------------------------------------
# Reporting
# ---------------------------------------------------------------------------
reporting:
  watchlist: watchlist.tsv
  # Every finding carries this. The pipeline produces analytical evidence, not
  # a diagnosis or a notification decision.
  disclaimer: >
    In-silico screening result. Sequence-based detection alone does not
    establish presence of viable organism, infection, or exposure. All findings
    require orthogonal laboratory confirmation and interpretation by a
    qualified laboratorian before any clinical or public-health action.
  escalate_tiers: [confirmed_in_silico, supported]
