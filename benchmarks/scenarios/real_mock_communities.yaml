# bioThreatFinder benchmark scenarios - REAL sequencing data, defined communities
#
# DRAFT. Nothing here has been downloaded or run.
#
# SRA/ENA accessions are VERIFIED against the ENA portal API (2026-10-03): platform, model,
# library_strategy, sample_title, read_count and fastq_bytes all checked per run. What
# remains unverified is marked VERIFY inline - the standards' lot numbers (taken from the
# data note, not from run metadata), the human WGS accession for the host-mixture arms, and
# the Zymo strain-to-taxid resolution the watchlist needs.
#
# ---------------------------------------------------------------------------
# WHY A SECOND SCENARIO FILE RATHER THAN MORE OF human_core.yaml
# ---------------------------------------------------------------------------
# These scenarios are NOT simulated. `scripts/simulate_benchmark.py` validates `kind`
# against its own KINDS list and will refuse `mock_community`, which is deliberate: the
# simulator must never be pointed at this file and silently "generate" reads for data
# that is supposed to come from a sequencer. `bin/evaluate_benchmark.py` treats `kind` as
# a label and does not validate it, so the evaluator reads this file happily.
#
# The consequence is that the manifest is WRITTEN BY HAND (or by a fetch script) rather
# than emitted by the simulator. Ground truth for a defined community comes from the
# manufacturer's composition sheet, not from a spike plan.
#
# ---------------------------------------------------------------------------
# WHAT REAL MOCK DATA BUYS THAT SIMULATION CANNOT
# ---------------------------------------------------------------------------
# 1. REAL ERROR PROFILES. ART and friends model what we already believe about the
#    instrument. ONT homopolymer and basecaller-version error, Illumina tile and adapter
#    artefacts, index hopping and chimeras are exactly the things that manufacture false
#    positives, and a simulator that produced them would be modelling them from the same
#    assumptions the pipeline uses to filter them.
# 2. ONT AT ALL. This pipeline has NEVER processed nanopore data. The D10 read-identity
#    floors and `--ont-identity-slack` in the marker tier are both PROVISIONAL and
#    entirely unmeasured. A real ONT run is the first evidence either has ever had.
# 3. A GENUINELY PRESENT NEAR NEIGHBOUR, which is arm (b) of D12 - see below.
#
# WHAT IT CANNOT DO, STATED PLAINLY
#   * No select agents. The Zymo standards contain NO B. anthracis, Y. pestis,
#     F. tularensis, Burkholderia or orthopox. LoD for the high-consequence agents still
#     requires the simulated series in human_core.yaml. This file does not replace it.
#   * No host. Both standards are microbial only, so host depletion - the pipeline's
#     first real filter - is not exercised by a neat mock run. `zymo_even_in_host`
#     below addresses that by MIXING, and says so rather than pretending otherwise.
#   * Strain identity matters. The watchlist is taxid-keyed and its Salmonella row says
#     "serovar is the actionable unit, not species", so the exact Zymo strains must be
#     resolved to taxids before truth means anything. VERIFY per lot.
#
# ---------------------------------------------------------------------------
# HOW THIS TESTS D12 - the point of the exercise
# ---------------------------------------------------------------------------
# D12 found `neighbour_ratio`'s denominator pinned at 2,710 +/- 70 reads while the target
# moved 530x, and attributed it to background Enterobacteriaceae cross-mapping onto a
# neighbour reference that was never spiked. D12 records a falsifiable prediction: the
# pedestal tracks Enterobacteriaceae abundance and falls to near zero in a clean
# background.
#
# The even standard is a natural experiment for this, because within ONE sample at ONE
# depth it contains both cases:
#
#   Salmonella enterica       near_neighbours: Escherichia coli;Citrobacter freundii
#                             -> E. coli IS PRESENT at ~12% genomic abundance.
#                                A low ratio here is a REAL competing signal.
#
#   Listeria monocytogenes    near_neighbours: Listeria innocua;L. seeligeri;L. ivanovii
#                             -> NONE of them are present.
#                                Any neighbour reads here are pedestal by construction.
#
# Same library, same depth, same error profile. If Listeria shows a substantial
# best-neighbour count with no Listeria neighbour in the sample, the pedestal is
# confirmed on real data. If Listeria's neighbour count is ~0 while Salmonella's is
# large, then the metric behaves as documented and D12's diagnosis is WRONG - which is
# the outcome this file has to be able to produce.
#
# ---------------------------------------------------------------------------
# PROVENANCE OF THE ACCESSIONS  -  VERIFIED against the ENA portal API 2026-10-03
# ---------------------------------------------------------------------------
# `[IND]` Nicholls SM, Quick JC, Tang S, Loman NJ (2019) "Ultra-deep, long-read nanopore
# sequencing of mock microbial community standards", GigaScience 8(5):giz043,
# doi:10.1093/gigascience/giz043.
#
# Study: PRJEB29504 (secondary ERP111811). 27 runs: 14 Oxford Nanopore, 12 Illumina.
# Queried via https://www.ebi.ac.uk/ena/portal/api/filereport - run accession, platform,
# model, library_strategy, sample_title, read_count and fastq_bytes all confirmed.
#
# THREE TRAPS IN THIS STUDY, each of which would fail silently:
#
# 1. SIX RUNS ARE EMPTY. ERR2887847, ERR2887848, ERR2887849 (Zymo-EVEN) and ERR2887850,
#    ERR2887851, ERR2887852 (Zymo-LOG) report read_count=0, fastq_bytes empty and NO
#    fastq files. They carry correct-looking titles and platforms, so picking one by
#    title gives an empty download that reads as "no organisms detected" - the exact
#    failure shape this project keeps finding. Do not use them.
#
# 2. NEAR-DUPLICATE RUN PAIRS. ERR3152364 and ERR2906227 are both Zymo-EVEN GridION with
#    3,491,390 vs 3,491,078 reads; ERR3152366 and ERR2906229 are both Zymo-LOG GridION
#    with 3,667,480 vs 3,667,007. They are almost certainly the same library, plausibly
#    re-basecalled. Using both would double-count one library as two replicates and
#    report a fabricated agreement. Pick ONE per community; this file uses the ERR3152xxx
#    pair, which is the set the data note cites. VERIFY the basecaller version if
#    read-identity numbers are ever compared across them.
#
# 3. PROMETHION IS 10x THE DOWNLOAD FOR NO BENEFIT HERE. ERR3152365 (Zymo-EVEN
#    PromethION) is 35.8M reads / 151 Gbases; the GridION run of the same community is
#    3.5M reads / 14 Gbases. Depth is not the limiting factor for any question in this
#    file, so GridION is specified throughout.
#
# Sizes (fastq_bytes, gzipped): ONT GridION EVEN 15.0 GB, LOG 17.1 GB. Illumina community
# EVEN 0.9 GB, LOG 3.2 GB. Ten isolates 0.44-1.60 GB each, ~8.6 GB for the set.
# Total for everything referenced here is ~45 GB.

schema_version: 1

defaults:
    # Overridden per scenario; these exist so a missing field fails loudly rather than
    # defaulting to a simulated-data assumption.
    replicates: 1
    platforms: [illumina, ont]
    host: human
    source: external_sra

scenarios:

    # -----------------------------------------------------------------------
    # EVEN COMMUNITY - the D12 natural experiment, and the first ONT data
    # -----------------------------------------------------------------------
    - id: zymo_even
      description: >
        ZymoBIOMICS Microbial Community Standard (D6300), even distribution: 8 bacteria
        at ~12% genomic abundance each and 2 yeasts at ~2%. Four members are on the human
        watchlist - E. coli, Salmonella enterica, Listeria monocytogenes and
        Cryptococcus neoformans - so this yields real-data true positives at known
        abundance. Run on BOTH Illumina and ONT from the same standard, which is what
        makes it the first measurement of the D10 ONT identity floors.
      kind: mock_community
      source: external_sra
      accessions:
          # VERIFIED 2026-10-03 via the ENA portal API.
          ont:      ["ERR3152364"]   # GridION, Zymo-EVEN, 3,491,390 reads, 15.0 GB
          illumina: ["ERR2984773"]   # MiSeq, in732_0_even_community_shotgun, 8,785,731 reads, 0.9 GB
      standard:
          product: D6300
          lot: ZRC190633             # from the data note; VERIFY against run metadata
          distribution: even
      truth:
          # Watchlist members genuinely present. Non-watchlist members are deliberately
          # NOT listed, matching the human_core.yaml convention for background taxa.
          present:
              - Escherichia coli
              - Salmonella enterica
              - Listeria monocytogenes
              - Cryptococcus neoformans
          # Everything high-consequence is absent BY CONSTRUCTION, which is the strongest
          # specificity statement available: real reads, real errors, no select agent.
          absent:
              - Bacillus anthracis
              - Yersinia pestis
              - Francisella tularensis
              - Burkholderia pseudomallei
              - Brucella melitensis
      expect:
          # Present at ~12% of a microbial-only library, so detection is not the question -
          # anything less than confirmed indicates a wiring or threshold fault.
          - taxon: Salmonella enterica
            min_tier: supported
          - taxon: Listeria monocytogenes
            min_tier: supported
          - taxon: Escherichia coli
            min_tier: supported
          # 2% yeast, ~19 Mb genome: the eukaryote arm, where breadth per read is lowest.
          - taxon: Cryptococcus neoformans
            min_tier: supported
          # Specificity on real data. A confirmed call for any of these is a false
          # positive that no simulated negative has been able to produce.
          - taxon: Bacillus anthracis
            max_tier: screened_only
          - taxon: Yersinia pestis
            max_tier: screened_only
          - taxon: Francisella tularensis
            max_tier: screened_only
          - taxon: Burkholderia pseudomallei
            max_tier: screened_only

    # -----------------------------------------------------------------------
    # LOG COMMUNITY - a real LoD series inside a single library
    # -----------------------------------------------------------------------
    - id: zymo_log
      description: >
        ZymoBIOMICS Microbial Community Standard II (D6310), LOG distribution: the same
        ten organisms spanning several orders of magnitude of abundance in one sample.
        This is D12 arm (a) - locating the detection cliff - without simulating anything,
        and it does it better than a dilution series because every level shares one
        library prep, one run and one error profile, so abundance is the only variable.
        The per-organism abundances come from the manufacturer's sheet for THIS LOT and
        must be read from it, not assumed.
      kind: mock_community
      source: external_sra
      accessions:
          # VERIFIED 2026-10-03 via the ENA portal API.
          ont:      ["ERR3152366"]   # GridION, Zymo-LOG, 3,667,480 reads, 17.1 GB
          illumina: ["ERR2935805"]   # HiSeq 1500, in745_0_log_community_shotgun, 47,832,553 reads, 3.2 GB
      standard:
          product: D6310
          lot: ZRC190842             # from the data note; VERIFY against run metadata
          distribution: log
      truth:
          present:
              - Escherichia coli
              - Salmonella enterica
              - Listeria monocytogenes
              - Cryptococcus neoformans
          absent:
              - Bacillus anthracis
              - Yersinia pestis
              - Francisella tularensis
      expect:
          # Deliberately NO min_tier on the low-abundance members until the lot sheet has
          # been read. Asserting a floor before knowing the abundance would be the D10/D11
          # mistake again: a threshold that cannot be met, or one that nothing can fail.
          - taxon: Bacillus anthracis
            max_tier: screened_only
          - taxon: Yersinia pestis
            max_tier: screened_only

    # -----------------------------------------------------------------------
    # EVEN COMMUNITY IN A HUMAN BACKGROUND - restores the host filter
    # -----------------------------------------------------------------------
    - id: zymo_even_in_host
      description: >
        The mock standards contain no human DNA, so a neat run leaves host depletion -
        the pipeline's first real filter - completely unexercised, and reports sensitivity
        at a host fraction no clinical specimen ever has. This scenario MIXES real mock
        reads with real human reads at ~95% host to match the simulated series, so the
        two are comparable.
        .
        This is a COMPUTATIONAL MIXTURE, not a sequenced co-extraction. It therefore does
        not reproduce competition during library prep or extraction bias, and must not be
        described as if it did. What it does measure is whether host depletion plus the
        stage-1 screen still recover a known organism at a realistic host fraction, using
        real reads on both sides.
      kind: mock_community
      source: external_sra
      mixture:
          microbial: zymo_even           # reuse the accessions above
          host_reads: VERIFY             # a real human WGS accession, to be chosen
          host_fraction: 0.95
      truth:
          present:
              - Escherichia coli
              - Salmonella enterica
              - Listeria monocytogenes
          absent:
              - Bacillus anthracis
              - Yersinia pestis
      expect:
          - taxon: Salmonella enterica
            min_tier: supported
          - taxon: Listeria monocytogenes
            min_tier: supported
          - taxon: Bacillus anthracis
            max_tier: screened_only

    # -----------------------------------------------------------------------
    # D12 ARM (c) - does the pedestal track background composition? REAL READS.
    # -----------------------------------------------------------------------
    - id: pedestal_background_titration
      description: >
        The decisive test of D12, and it needs no simulation. The same study sequenced all
        TEN member organisms as individual Illumina isolates, so background composition can
        be titrated with real reads carrying real error profiles.
        .
        D12 predicts that `best_neighbour_reads` for a target is dominated by background
        Enterobacteriaceae cross-mapping onto the neighbour reference rather than by any
        genuine neighbour signal. Hold a target isolate at a FIXED low abundance and sweep
        E. coli across roughly 0 / 0.2 / 2 / 20% of the library.
        .
        PREDICTION (D12): best_neighbour_reads rises with E. coli abundance and approaches
        zero in a clean background, while the target's own read count stays flat - so
        `neighbour_ratio` moves without the target changing at all. If the neighbour count
        stays flat instead, D12's diagnosis is WRONG and the metric behaves as documented.
        .
        Run it with Salmonella enterica (declared neighbour IS E. coli, so the ratio should
        genuinely move) and with Listeria monocytogenes (no declared neighbour present at
        any point, so ANY movement is pedestal). The contrast is the measurement.
      kind: mock_community
      source: external_sra
      mixture:
          # VERIFIED 2026-10-03 via the ENA portal API. All Illumina HiSeq 1500, paired.
          targets:
              Salmonella enterica:     ERR2935848   # 14,269,735 reads, 0.91 GB
              Listeria monocytogenes:  ERR2935854   # 10,564,043 reads, 0.65 GB
          background_titration:
              Escherichia coli: ERR2935852          # 7,099,045 reads, 0.44 GB
              fractions: [0.0, 0.002, 0.02, 0.20]
          # Non-Enterobacteriaceae filler, so total depth is held constant while only the
          # E. coli fraction varies - otherwise abundance and composition move together and
          # the result cannot be attributed to either.
          filler: ERR2935853                        # Pseudomonas aeruginosa, 0.46 GB
          host_reads: VERIFY                        # real human WGS, for the ~95% host arm
      truth:
          present: [Salmonella enterica, Listeria monocytogenes, Escherichia coli]
          absent:  [Bacillus anthracis, Yersinia pestis, Francisella tularensis]
      expect:
          # No min_tier yet: the point is to MEASURE how neighbour_ratio moves, and
          # asserting a tier before that measurement exists would prejudge the D12 fix.
          - taxon: Bacillus anthracis
            max_tier: screened_only
          - taxon: Yersinia pestis
            max_tier: screened_only

    # -----------------------------------------------------------------------
    # THE TEN ISOLATES - per-organism ground truth, one organism per library
    # -----------------------------------------------------------------------
    # All Illumina HiSeq 1500, paired, VERIFIED 2026-10-03 via the ENA portal API.
    # Four are on the human watchlist; the rest are the background and filler used above.
    #
    #   ERR2935848  Salmonella enterica         14,269,735 reads  0.91 GB   WATCHLIST
    #   ERR2935854  Listeria monocytogenes      10,564,043        0.65 GB   WATCHLIST
    #   ERR2935852  Escherichia coli             7,099,045        0.44 GB   WATCHLIST
    #   ERR2935856  Cryptococcus neoformans      8,422,093        0.52 GB   WATCHLIST
    #   ERR2935849  Staphylococcus aureus       17,188,862        1.02 GB
    #   ERR2935850  Enterococcus faecalis       18,870,511        1.14 GB
    #   ERR2935851  Bacillus subtilis           23,164,220        1.60 GB
    #   ERR2935853  Pseudomonas aeruginosa       7,386,928        0.46 GB
    #   ERR2935855  Saccharomyces cerevisiae    11,944,989        0.75 GB
    #   ERR2935857  Lactobacillus fermentum     16,379,390        1.07 GB
    #
    # A single-organism library is the cleanest possible specificity test: every read has
    # one correct answer, so any watchlist call other than the organism itself is a false
    # positive with no ambiguity about truth. Worth running before the community arms.
