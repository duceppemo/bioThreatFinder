# bioThreatFinder benchmark scenarios - human health pack
#
# PURPOSE
# Every threshold in packs/*/pack.yaml is currently a reasoned guess. These
# scenarios replace guesses with measurements: per-taxon sensitivity, limit of
# detection, specificity against the near neighbours that actually cause false
# positives, and the positive predictive value of each evidence tier.
#
# DESIGN PRINCIPLE
# A benchmark that only spikes targets into a clean background measures almost
# nothing. Any tool looks good at 100 RPM of pure B. anthracis. The scenarios
# that matter are the ones designed to BREAK the tool:
#
#   * the near neighbour alone, with the target genuinely absent
#   * the target's chromosome WITHOUT its virulence plasmids
#   * the vaccine strain instead of wild type
#   * realistic host fraction, so sensitivity is measured where it is hard
#   * index hopping from a high-titre neighbouring sample
#   * a divergent family member standing in for a novel agent
#
# A specificity failure here is worth more attention than a sensitivity failure,
# because a false "confirmed" on a high-consequence organism triggers a real
# public-health response.
#
# HONEST LIMITS OF SIMULATION
# Simulated reads flatter every tool. Error profiles are idealised, there is no
# real reagent contamination, no index-hopping chemistry, no degraded clinical
# material, and no genuine novel agent. These scenarios establish RELATIVE
# performance and catch regressions. They do NOT establish clinical performance -
# that needs mock communities, proficiency panels and characterised real
# specimens. See docs/benchmarking.md.

schema_version: 1

# ---------------------------------------------------------------------------
# COST, and why these numbers are what they are.
#
# The full matrix is 392 samples. At 20M reads each that is ~8 billion reads and an
# estimated 8.4 TiB of FASTQ, which exceeds the free space on the machine this was
# written on (5.8 TiB). Run it in tiers rather than all at once - see the recipe in
# docs/benchmarking.md - or raise total_reads only for the scenarios whose question
# actually needs depth.
#
# ONT DEPTH IS NOT THE SAME NUMBER AS ILLUMINA DEPTH. 20M reads at a 5 kb mean is
# ~100 Gbp, which no real flow cell delivers; a PromethION run at that fragment length
# is closer to 2-6M reads. `ont_total_reads` therefore overrides `total_reads` for the
# ONT arm. Simulating 20M ONT reads would measure a machine that does not exist, and
# would flatter long-read sensitivity accordingly.
# ---------------------------------------------------------------------------

defaults:
    replicates: 3
    platforms: [illumina, ont]
    total_reads: 20000000
    ont_total_reads: 4000000
    host: human
    # ~94-95% human, typical of respiratory and tissue specimens. Measuring
    # sensitivity in a clean background would overstate it substantially.
    #
    # host_fraction is a FLOOR, not a target, and it is validated against the HIGHEST
    # spike level in the scenario. The simulator gives spikes and background their
    # declared shares and the host absorbs whatever is left, recording the realised
    # fraction per sample in the manifest. With 4.9% background and a 1%-of-library top
    # spike, the most the host can take at that level is 94.1% - so declaring 0.95
    # makes the scenario unbuildable, which is how this was found. 0.94 holds at every
    # level; realised host runs ~94.1% at the top spike to ~95.1% at the bottom.
    host_fraction: 0.94
    read_length: 150
    ont_mean_length: 5000
    # Commensal and environmental background, 4.9% of the library. Without this,
    # "negative" means host-only, which understates the false-positive rate -
    # real specimens contain plenty of organisms that are genomically adjacent to
    # watchlist taxa. Every taxon here is a near neighbour already present in the
    # pack's reference manifest, so no extra genomes need fetching.
    #
    # WHY 5% AND NOT 2%: host_fraction is a FLOOR, not a target. The simulator gives
    # spikes and background their declared shares and the HOST ABSORBS THE REMAINDER,
    # recording the realised fraction in the manifest. So with a 2% background these
    # scenarios declared 95% host and actually produced ~97.5%, and the low-biomass
    # scenario's "99.8% host" was barely distinguishable from them. Setting non-host
    # load to 4.9% makes the declared 0.95 realisable - it has to sit just UNDER 5%,
    # because the spike itself also claims a share and host_fraction + spikes +
    # background must not exceed the library. And
    # leaves the low-biomass scenario (0.05% background) genuinely ~40x lower in
    # microbial load - which is what low biomass means.
    #
    # Note E. coli: commensal E. coli SHOULD be detected and should NOT be
    # confirmed, because confirmation is gated on pathotype markers it does not
    # carry. Having it in every background is a free, continuous test of that rule.
    #
    # Background taxa are deliberately NOT listed in per-scenario `truth` blocks.
    # The evaluator reports findings it cannot match to truth as `unlisted` and
    # keeps them out of the PPV denominator, so background does not silently
    # inflate or deflate specificity. `negative_host_only` lists them explicitly,
    # so that one scenario's false-positive rate is exact.
    background:
        "Escherichia coli": 0.020
        "Neisseria lactamica": 0.010
        "Haemophilus haemolyticus": 0.007
        "Listeria innocua": 0.007
        "Bacillus thuringiensis": 0.005

scenarios:

    # -----------------------------------------------------------------------
    # PLUMBING POSITIVE CONTROL
    #
    # This scenario exists to fail loudly when the pipeline is misconfigured, and
    # for no other reason. A 5000 RPM spike is far above any plausible detection
    # limit, so if it does not come back confirmed_in_silico then something is wrong
    # with the wiring and NO other result in the batch should be trusted.
    #
    # It earns its place because this project has now hit the same failure shape
    # three times: a rotted watchlist taxid, a GTDB-namespaced Metabuli index, and a
    # refs base written to the wrong volume. Every one produces an EMPTY result that
    # is indistinguishable from a clean negative. Guards were added for all three,
    # but a guard only catches the mechanism it knows about; a loud positive control
    # catches the class.
    # -----------------------------------------------------------------------

    - id: plumbing_positive_control
      description: >
        Overwhelming spike of an easy target. Any outcome other than confirmed is a
        configuration fault, not a biological result. Check this first.
      kind: lod_series
      replicates: 1
      # Deliberately shallow. This scenario's only job is to prove the wiring, and at
      # 5000 rpm even 2M reads gives 10,000 spike reads - far above any threshold. Full
      # depth here would mean simulating ~19M host reads to answer a question that does
      # not depend on depth, and the point of a plumbing check is that it is cheap
      # enough to run before every batch.
      total_reads: 2000000
      ont_total_reads: 400000
      host_fraction: 0.50
      spikes:
          - taxon: Yersinia pestis
            source: target
            levels_rpm: [5000]
      truth:
          present: [Yersinia pestis]
      expect:
          - taxon: Yersinia pestis
            min_tier: confirmed_in_silico

    # -----------------------------------------------------------------------
    # SENSITIVITY / LIMIT OF DETECTION
    #
    # Designed against New York State DOH CLEP, "Validation of Next Generation
    # Sequencing (NGS) Methods for Identification and/or Characterization of
    # Infectious Agents" (March 2023) - the only document from any regulator with
    # concrete numeric acceptance criteria that explicitly addresses metagenomic
    # assays. Four of its requirements shape what follows:
    #
    #   1. "For metagenomic sequencing assays, a LOD should be determined for
    #      representative members of EACH CATEGORY of pathogen that may be reported
    #      (e.g. DNA virus, RNA virus, gram-positive bacteria, gram-negative
    #      bacteria, mold, yeast, parasite)." All seven categories are covered below
    #      and tagged with nysdoh_category so the mapping is auditable.
    #   2. "6-8 ten-fold dilutions in specimen matrix with at least one dilution to
    #      extinction." Levels are therefore DECADES, not the arbitrary steps this
    #      file used before.
    #
    #      PLATFORM ASYMMETRY: the RPM floor is set by read count, so it differs by
    #      platform. At 20M Illumina reads one read is 0.05 rpm; at 4M ONT reads it is
    #      0.25 rpm. The shared series therefore starts at 1 rpm so both arms can
    #      represent every level, and `lod_trace_illumina_deep` probes below that on
    #      Illumina alone at 100M reads. Quoting a sub-1-rpm ONT LoD would require
    #      simulating a flow cell that does not exist.
    #
    #      DEPTH FLOOR: at the default 20M reads, 1 read is 0.05 rpm, so 0.01 rpm
    #      rounds to zero reads and the simulator refuses it. The series therefore
    #      bottoms out at 0.1 rpm (~2 reads) - which IS extinction at this depth.
    #      Probing below it needs a deeper library, not a smaller number; reaching
    #      NYSDOH's full 6-8 dilutions at trace levels would require ~100M+ reads
    #      per replicate. Recorded rather than quietly fudged.
    #   3. Separate LoD per specimen type. We approximate specimen type by host
    #      fraction, which is the dominant driver; a real dossier needs real
    #      matrices (CSF, BAL, serum, tissue, stool) and this cannot substitute.
    #   4. Co-infection studies with up to 4 agents, to show no LoD degradation.
    #
    # CAVEAT ON REPLICATE COUNT: 3 replicates establishes the shape of the detection
    # curve, not a defensible LoD. CLSI EP17-A2E-style confirmation needs ~20
    # replicates at the candidate LoD to claim 95% detection. Run the curve first,
    # then a confirmation scenario at the level it indicates.
    # -----------------------------------------------------------------------

    - id: lod_gram_negative
      description: >
        Y. pestis decade dilution series. 4.6 Mb gram-negative genome; the reference
        case, and the taxon whose read floor is taken from UKHSA mSCAPE (min_count 100).
      kind: lod_series
      nysdoh_category: gram_negative_bacteria
      spikes:
          - taxon: Yersinia pestis
            source: target
            levels_rpm: [1, 10, 100, 1000, 10000]
      truth:
          present: [Yersinia pestis]
      expect:
          - taxon: Yersinia pestis
            min_tier_at_rpm: {100: supported, 1000: confirmed_in_silico}

    - id: lod_gram_positive
      description: >
        L. monocytogenes decade series. Gram-positive, 2.9 Mb, and its near
        neighbour L. innocua is in the standing background - so this measures
        sensitivity in the presence of the confuser rather than in a clean field.
      kind: lod_series
      nysdoh_category: gram_positive_bacteria
      spikes:
          - taxon: Listeria monocytogenes
            source: target
            levels_rpm: [1, 10, 100, 1000, 10000]
      truth:
          present: [Listeria monocytogenes]
      expect:
          - taxon: Listeria monocytogenes
            min_tier_at_rpm: {100: supported}

    - id: lod_rna_virus
      description: >
        SARS-CoV-2 decade series. 30 kb RNA virus - breadth saturates fast, so
        detection should reach further down per RPM than for any bacterium.
      kind: lod_series
      nysdoh_category: rna_virus
      spikes:
          - taxon: Severe acute respiratory syndrome coronavirus 2
            source: target
            levels_rpm: [1, 10, 100, 1000]
      truth:
          present: [Severe acute respiratory syndrome coronavirus 2]
      expect:
          - taxon: Severe acute respiratory syndrome coronavirus 2
            min_tier_at_rpm: {10: supported, 100: confirmed_in_silico}

    - id: lod_dna_virus
      description: >
        Mpox decade series. ~197 kb dsDNA orthopoxvirus. A separate category from
        RNA viruses because library chemistry and genome size both differ, and
        because orthopoxvirus collinearity makes it the harder call.
      kind: lod_series
      nysdoh_category: dna_virus
      spikes:
          - taxon: Monkeypox virus
            source: target
            levels_rpm: [1, 10, 100, 1000]
      truth:
          present: [Monkeypox virus]
      expect:
          - taxon: Monkeypox virus
            min_tier_at_rpm: {100: supported}

    - id: lod_parasite
      description: >
        P. falciparum decade series. 23 Mb AT-rich genome, so breadth accumulates
        slowly - this is the scenario that tests whether the 0.005 breadth floor is
        right or merely convenient.
      kind: lod_series
      nysdoh_category: parasite
      spikes:
          - taxon: Plasmodium falciparum
            source: target
            levels_rpm: [1, 10, 100, 1000, 10000]
      truth:
          present: [Plasmodium falciparum]
      expect:
          - taxon: Plasmodium falciparum
            min_tier_at_rpm: {1000: supported}

    - id: lod_yeast
      description: >
        C. auris decade series. Yeast, repeat-rich, poorly served by GTDB-based
        profiling so it leans on the nucleotide arm plus alignment.
      kind: lod_series
      nysdoh_category: yeast
      spikes:
          - taxon: Candida auris
            source: target
            levels_rpm: [1, 10, 100, 1000]
      truth:
          present: [Candida auris]
      expect:
          - taxon: Candida auris
            min_tier_at_rpm: {1000: supported}

    - id: lod_mold
      description: >
        A. fumigatus decade series. Mold - a distinct NYSDOH category from yeast.
        Also the honest case: it is a ubiquitous airborne contaminant, so a
        detection means little without cyp51A resistance context.
      kind: lod_series
      nysdoh_category: mold
      spikes:
          - taxon: Aspergillus fumigatus
            source: target
            levels_rpm: [1, 10, 100, 1000]
      truth:
          present: [Aspergillus fumigatus]
      expect:
          - taxon: Aspergillus fumigatus
            min_tier_at_rpm: {1000: supported}

    - id: lod_lowbiomass_gram_negative
      description: >
        The same Y. pestis series at 99.8% host. NYSDOH requires a separate LoD per
        specimen type; host fraction is the dominant axis we can simulate. THIS is the
        number to quote as the practical limit of detection, not the one from the 95%
        host scenarios.
      kind: lod_series
      nysdoh_category: gram_negative_bacteria
      # As first written this scenario was arithmetically impossible and I did not
      # notice: 99.9% host plus a top spike of 10,000 rpm (1% of the library) plus the
      # 2% commensal background from `defaults` sums past 1.0. The simulator refused it,
      # correctly.
      #
      # Resolved by keeping the punishing host fraction - which is the entire point -
      # and giving up the top decade instead, since at 99.8% host a 0.1% spike is
      # already the realistic high end. Background is overridden down to 0.05% so it
      # does not eat the remaining headroom.
      #   0.998 host + 0.001 spike + 0.0005 background = 0.9995
      host_fraction: 0.998
      total_reads: 40000000
      background:
          "Escherichia coli": 0.0005
      spikes:
          - taxon: Yersinia pestis
            source: target
            levels_rpm: [1, 10, 100, 1000]
      truth:
          present: [Yersinia pestis]

    - id: lod_trace_illumina_deep
      description: >
        The bottom of the range, Illumina only and deeper. Sub-1-rpm detection is not
        REPRESENTABLE in a realistic ONT run: at 4M reads one read already is 0.25 rpm,
        so a 0.1 rpm level would round to zero and the simulator refuses it. That is a
        genuine property of long-read metagenomics at trace abundance, not a simulation
        artifact, and it belongs in the results rather than being hidden by inflating
        ONT depth to a number no flow cell produces.
      kind: lod_series
      nysdoh_category: gram_negative_bacteria
      platforms: [illumina]
      total_reads: 100000000
      replicates: 3
      spikes:
          - taxon: Yersinia pestis
            source: target
            levels_rpm: [0.01, 0.1, 1]
      truth:
          present: [Yersinia pestis]

    - id: downsample_accuracy_floor
      description: >
        In-silico down-sampling of a comfortably positive library, to find the depth
        at which the pipeline stops being accurate. NYSDOH CLEP endorses exactly
        this: "a pipeline's lower limit for accuracy can be assessed with in-silico
        serial down-sampling of sequencing reads." Cheaper than a dilution series
        because it re-uses one library, and it isolates the DRY lab.
      kind: lod_series
      nysdoh_category: pipeline_floor
      spikes:
          - taxon: Yersinia pestis
            source: target
            levels_rpm: [100]
      truth:
          present: [Yersinia pestis]
      downsample_total_reads: [40000000, 20000000, 10000000, 5000000, 2000000, 1000000]

    # -----------------------------------------------------------------------
    # SPECIFICITY - the near neighbours that actually cause false positives.
    # In every scenario below the target is genuinely ABSENT. Any call above
    # max_tier is a specificity failure.
    # -----------------------------------------------------------------------

    - id: spec_bcereus_not_anthracis
      description: >
        B. cereus at high titre, no B. anthracis. The chromosome is near-identical
        across the group, so naive breadth-based calling reports anthrax here.
        This is the single most important specificity test in the pack.
      kind: specificity
      spikes:
          - taxon: Bacillus cereus
            source: neighbour
            levels_rpm: [500]
      truth:
          present: [Bacillus cereus]
          absent: [Bacillus anthracis]
      expect:
          - taxon: Bacillus anthracis
            max_tier: attributed_to_neighbour

    - id: spec_bthailandensis_not_pseudomallei
      description: >
        B. thailandensis is common environmental soil flora and the dominant
        false-positive route to melioidosis.
      kind: specificity
      spikes:
          - taxon: Burkholderia thailandensis
            source: neighbour
            levels_rpm: [500]
      truth:
          present: [Burkholderia thailandensis]
          absent: [Burkholderia pseudomallei, Burkholderia mallei]
      expect:
          - taxon: Burkholderia pseudomallei
            max_tier: attributed_to_neighbour

    - id: spec_edispar_not_histolytica
      description: >
        E. dispar is morphologically identical to E. histolytica, non-pathogenic,
        and the most important false positive in the genus. Microscopy cannot
        separate them, so this is exactly where sequencing should add value - or
        fail visibly.
      kind: specificity
      spikes:
          - taxon: Entamoeba dispar
            source: neighbour
            levels_rpm: [500]
      truth:
          present: [Entamoeba dispar]
          absent: [Entamoeba histolytica]
      expect:
          - taxon: Entamoeba histolytica
            max_tier: attributed_to_neighbour

    - id: spec_reston_not_zaire
      description: >
        Reston ebolavirus is not pathogenic to humans. Species-level resolution
        within Ebolavirus is therefore essential rather than a nicety, and this
        scenario measures whether GP resolution delivers it.
      kind: specificity
      spikes:
          - taxon: Reston ebolavirus
            source: neighbour
            levels_rpm: [200]
      truth:
          present: [Reston ebolavirus]
          absent: [Zaire ebolavirus, Sudan ebolavirus]
      expect:
          - taxon: Zaire ebolavirus
            max_tier: attributed_to_neighbour

    - id: spec_bholmesii_not_pertussis
      description: >
        B. holmesii shares IS481 with B. pertussis, which is the classic
        false-positive route in pertussis diagnostics. Tests that the rule engine
        correctly refuses to confirm on a multi-copy shared element.
      kind: specificity
      spikes:
          - taxon: Bordetella holmesii
            source: neighbour
            levels_rpm: [500]
      truth:
          present: [Bordetella holmesii]
          absent: [Bordetella pertussis]
      expect:
          - taxon: Bordetella pertussis
            max_tier: marker_veto

    - id: spec_ypseudotuberculosis_not_pestis
      description: >
        Over 97% chromosomal ANI to Y. pestis, separated only by plasmid content.
      kind: specificity
      spikes:
          - taxon: Yersinia pseudotuberculosis
            source: neighbour
            levels_rpm: [500]
      truth:
          present: [Yersinia pseudotuberculosis]
          absent: [Yersinia pestis]
      expect:
          - taxon: Yersinia pestis
            max_tier: marker_veto

    - id: spec_mixed_neighbours
      description: >
        Five confusers at once with no watchlist target present. Closer to a real
        environmental or gut background than any single-confuser scenario, and it
        tests whether false positives compound.
      kind: specificity
      spikes:
          - taxon: Bacillus cereus
            source: neighbour
            levels_rpm: [200]
          - taxon: Burkholderia thailandensis
            source: neighbour
            levels_rpm: [200]
          - taxon: Yersinia pseudotuberculosis
            source: neighbour
            levels_rpm: [200]
          - taxon: Listeria innocua
            source: neighbour
            levels_rpm: [200]
          - taxon: Francisella novicida
            source: neighbour
            levels_rpm: [200]
      truth:
          present: [Bacillus cereus, Burkholderia thailandensis, Yersinia pseudotuberculosis, Listeria innocua, Francisella novicida]
          absent: [Bacillus anthracis, Burkholderia pseudomallei, Yersinia pestis, Listeria monocytogenes, Francisella tularensis]

    # -----------------------------------------------------------------------
    # MARKER GATE - the scenarios that justify the whole marker tier.
    # exclude_loci simulates a strain lacking the loci that make it dangerous.
    # -----------------------------------------------------------------------

    - id: marker_anthracis_no_plasmids
      description: >
        B. anthracis chromosome with pXO1 and pXO2 REMOVED - the situation a cured
        or plasmid-free isolate presents, and what a B. cereus-group organism
        carrying anthracis-like chromosome looks like. Alignment evidence will be
        overwhelming. The correct answer is NOT confirmed, because without plasmid
        markers the call is not defensible.
      kind: marker_ablation
      spikes:
          - taxon: Bacillus anthracis
            source: target
            exclude_loci: [pXO1, pXO2]
            levels_rpm: [500]
      truth:
          present: [Bacillus anthracis]
      expect:
          - taxon: Bacillus anthracis
            max_tier: supported
            min_tier: supported

    - id: marker_pestis_no_plasmids
      description: >
        Y. pestis chromosome without pPCP1 and pMT1. Chromosomally indistinguishable
        from Y. pseudotuberculosis, so must not confirm.
      kind: marker_ablation
      spikes:
          - taxon: Yersinia pestis
            source: target
            exclude_loci: [pPCP1, pMT1, pCD1]
            levels_rpm: [500]
      truth:
          present: [Yersinia pestis]
      expect:
          - taxon: Yersinia pestis
            max_tier: supported

    - id: marker_cholerae_nontoxigenic
      description: >
        Non-toxigenic environmental V. cholerae - species present, CTX phage
        absent. Widespread in surface water. Species detection is correct;
        reporting cholera would not be.
      kind: marker_ablation
      spikes:
          - taxon: Vibrio cholerae
            source: target
            exclude_loci: [CTXphi, ctxA, ctxB]
            levels_rpm: [500]
      truth:
          present: [Vibrio cholerae]
      expect:
          - taxon: Vibrio cholerae
            max_tier: supported

    # -----------------------------------------------------------------------
    # VACCINE AND ATTENUATED STRAINS
    # Expected outcome is the vaccine_strain tier - a stand-down, not a disease
    # report and not a silent suppression.
    # -----------------------------------------------------------------------

    - id: vaccine_bcg
      description: >
        BCG (M. bovis-derived, RD1 deleted) in a specimen from a vaccinated or
        recently instilled patient. Must read as vaccine strain, not tuberculosis.
      kind: vaccine
      spikes:
          - taxon: Mycobacterium bovis BCG
            source: vaccine
            levels_rpm: [200]
      truth:
          present: [Mycobacterium bovis BCG]
          vaccine: [Mycobacterium tuberculosis]
      expect:
          - taxon: Mycobacterium tuberculosis
            max_tier: vaccine_strain

    - id: vaccine_vaccinia
      description: >
        Vaccinia virus - smallpox vaccine and ubiquitous laboratory strain, and
        the dominant false positive for variola. The highest-stakes specificity
        test in the pack.
      kind: vaccine
      spikes:
          - taxon: Vaccinia virus
            source: vaccine
            levels_rpm: [200]
      truth:
          present: [Vaccinia virus]
          absent: [Variola virus]
          vaccine: [Variola virus]
      expect:
          - taxon: Variola virus
            max_tier: vaccine_strain

    - id: vaccine_sabin_polio
      description: >
        Sabin oral poliovirus vaccine strain. Separating vaccine, vaccine-derived
        and wild-type poliovirus changes the entire public-health response.
      kind: vaccine
      spikes:
          - taxon: Human poliovirus 1
            source: vaccine
            levels_rpm: [200]
      truth:
          present: [Human poliovirus 1]
          vaccine: [Enterovirus C]
      expect:
          - taxon: Enterovirus C
            max_tier: vaccine_strain

    - id: vaccine_brucella_rb51
      description: >
        Brucella RB51 cattle vaccine strain, a realistic finding in veterinary and
        abattoir-adjacent specimens.
      kind: vaccine
      spikes:
          - taxon: Brucella abortus
            source: vaccine
            levels_rpm: [200]
      truth:
          present: [Brucella abortus]
          vaccine: [Brucella abortus]
      expect:
          - taxon: Brucella abortus
            max_tier: vaccine_strain

    # -----------------------------------------------------------------------
    # DIVERGENT AGENT PROXY
    # A genuinely novel agent cannot be simulated - if it were in a database it
    # would not be novel. A related family member the pack does NOT target is the
    # closest honest stand-in, and tests whether the protein and HMM tiers see
    # something the nucleotide tier misses.
    # -----------------------------------------------------------------------

    - id: divergent_bundibugyo_filovirus
      description: >
        Bundibugyo ebolavirus as a proxy for a divergent filovirus. Expect at
        least a flagged lead via the HMM tier, not silence. A tool that reports
        nothing here would also report nothing for a new filovirus.
      kind: specificity
      spikes:
          - taxon: Bundibugyo ebolavirus
            source: neighbour
            levels_rpm: [200]
      truth:
          present: [Bundibugyo ebolavirus]
          absent: [Zaire ebolavirus, Sudan ebolavirus]
      expect:
          - taxon: Zaire ebolavirus
            min_tier: screened_only
            max_tier: supported

    - id: divergent_clostridium_bont
      description: >
        C. butyricum carrying BoNT/E - toxin present, species is not
        C. botulinum. Correct behaviour is to report the toxin and name the right
        organism, which the veto rule should produce.
      kind: specificity
      spikes:
          - taxon: Clostridium butyricum
            source: neighbour
            levels_rpm: [300]
      truth:
          present: [Clostridium butyricum]
          absent: [Clostridium botulinum]
      expect:
          - taxon: Clostridium botulinum
            max_tier: marker_veto

    # -----------------------------------------------------------------------
    # CONTAMINATION AND CONTROLS
    # -----------------------------------------------------------------------

    - id: negative_host_only
      description: >
        Host plus commensal background, no watchlist organism at all. Every
        watchlist call here is a false positive. This scenario sets the
        run-level false-positive rate, which is the number that determines
        whether the tool is usable operationally.
      kind: negative
      spikes: []
      truth:
          # Background taxa listed explicitly HERE and nowhere else, so this one
          # scenario's false-positive rate is exact rather than diluted by
          # 'unlisted' findings.
          present: [Escherichia coli, Neisseria lactamica, Haemophilus haemolyticus, Listeria innocua, Bacillus thuringiensis]
          absent: [Bacillus anthracis, Yersinia pestis, Francisella tularensis, Burkholderia pseudomallei, Variola virus, Zaire ebolavirus, Mycobacterium tuberculosis, Entamoeba histolytica, Listeria monocytogenes, Neisseria meningitidis, Haemophilus influenzae]
      controls:
          include_ntc: true

    - id: contamination_index_hop
      description: >
        High-titre Y. pestis sample sequenced alongside a negative. A 0.1% index
        hop puts real Y. pestis reads in the negative - routine in multiplexed
        low-biomass work, and a false positive that control subtraction must
        catch. Tests the suppressed_control path.
      kind: contamination
      spikes:
          - taxon: Yersinia pestis
            source: target
            levels_rpm: [5000]
      truth:
          present: [Yersinia pestis]
      controls:
          include_ntc: true
          index_hop_fraction: 0.001
      expect:
          # The control must not read as a positive finding. Note the expected
          # tier is control_background, NOT suppressed_control: a control's own
          # content is tiered control_background, while suppressed_control is what
          # a SAMPLE gets when its signal fails to exceed the control. Asserting
          # suppressed_control here would be asserting the wrong mechanism.
          - taxon: Yersinia pestis
            sample_role: control
            max_tier: control_background
          # And the genuine 5000 RPM positive must survive control subtraction.
          # A contamination guard that suppresses true positives is worse than
          # none, so this half of the test matters as much as the other.
          - taxon: Yersinia pestis
            sample_role: sample
            min_tier: confirmed_in_silico

    - id: contamination_no_control
      description: >
        Same as above but with NO negative control in the batch. Every finding
        must carry the run-level warning. Verifies the pipeline degrades loudly
        rather than silently when a control is missing.
      kind: contamination
      spikes:
          - taxon: Yersinia pestis
            source: target
            levels_rpm: [50]
      truth:
          present: [Yersinia pestis]
      controls:
          include_ntc: false

    # -----------------------------------------------------------------------
    # CO-INFECTION
    # -----------------------------------------------------------------------

    - id: coinfection_four_targets
      description: >
        Four unrelated watchlist targets at different abundances plus two confusers.
        Four because NYSDOH CLEP asks for co-infection studies with up to 4 agents at
        mixed high and low concentrations, to demonstrate no LoD degradation. Tests
        that one strong signal does not mask a weaker one and that abundance
        estimation does not cross-talk between taxa.
      kind: lod_series
      nysdoh_category: coinfection
      spikes:
          - taxon: Yersinia pestis
            source: target
            levels_rpm: [200]
          - taxon: Mycobacterium tuberculosis
            source: target
            levels_rpm: [20]
          - taxon: Plasmodium falciparum
            source: target
            levels_rpm: [500]
          - taxon: Candida auris
            source: target
            levels_rpm: [50]
          - taxon: Bacillus cereus
            source: neighbour
            levels_rpm: [500]
          - taxon: Entamoeba dispar
            source: neighbour
            levels_rpm: [200]
      truth:
          present: [Yersinia pestis, Mycobacterium tuberculosis, Plasmodium falciparum, Candida auris, Bacillus cereus, Entamoeba dispar]
          absent: [Bacillus anthracis, Entamoeba histolytica]
      expect:
          - taxon: Yersinia pestis
            min_tier: supported
          - taxon: Bacillus anthracis
            max_tier: attributed_to_neighbour
          - taxon: Entamoeba histolytica
            max_tier: attributed_to_neighbour
